<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library System</title>

    <link rel="stylesheet" href="Tsotetsi.css">
</head>

<body>

    <header>
        <h1>📚 My Library System</h1>
        <p>Manage your books and transactions</p>
    </header>

    <main>

        <!-- Add Book Section -->
        <section class="card">
            <h2>Add a New Book</h2>

            <input type="text" id="bookTitle" placeholder="Enter book title">
            <input type="text" id="bookAuthor" placeholder="Enter author">

            <button id="addBookBtn">Add Book</button>
        </section>


        <!-- Books Section -->
        <section class="card">
            <h2>Available Books</h2>

            <div id="bookList">
                <p id="noBooks">No books available.</p>
            </div>
        </section>


        <!-- Transaction History -->
        <section class="card">
            <h2>Transaction History</h2>

            <div id="transactionList">
                <p id="noTransactions">No transactions yet.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Library Management System</p>
    </footer>

    <script src="Moses.js"></script>

</body>
</html>
